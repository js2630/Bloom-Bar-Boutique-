<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Lilac Purple: #8F75BA, Olive Gold: #B5AD66 -->
    <g id="flower" stroke="#8F75BA" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <!-- Left petal -->
      <path d="M 0 0 C -8 -5, -12 -12, -6 -15 C -2 -10, 0 -5, 0 0" />
      <!-- Center petal -->
      <path d="M 0 0 C -4 -8, 0 -18, 0 -18 C 0 -18, 4 -8, 0 0" />
      <!-- Right petal -->
      <path d="M 0 0 C 8 -5, 12 -12, 6 -15 C 2 -10, 0 -5, 0 0" />
      <path d="M 0 2 L 0 6" /> <!-- stem -->
    </g>

    <g id="leaf" stroke="#8F75BA" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 0 0 C -6 -8, -6 -18, 0 -22 C 6 -18, 6 -8, 0 0" />
      <path d="M 0 0 L 0 -12" stroke-width="1.5" />
    </g>

    <g id="gold_buds" stroke="#B5AD66" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="-5" cy="-7" r="2.5" />
      <circle cx="5" cy="-6" r="2.5" />
      <path d="M 0 0 C -3 -4, -4 -6, -5 -5" stroke-width="2" />
      <path d="M 0 0 C 3 -3, 4 -4, 5 -4" stroke-width="2" />
    </g>
  </defs>

  <!-- Wreath Rings -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#8F75BA" stroke-width="2.5" />
  <circle cx="100" cy="100" r="77" fill="none" stroke="#8F75BA" stroke-width="1.5" />

  <!-- Vines crossing at the bottom -->
  <path d="M 112 165 Q 90 185 65 160 C 40 135, 30 65, 85 30" fill="none" stroke="#8F75BA" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 88 165 Q 110 185 135 160 C 160 135, 170 65, 115 30" fill="none" stroke="#8F75BA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Botanicals -->
  <use href="#flower" x="32" y="105" transform="rotate(-90 32 105)" />
  <use href="#flower" x="60" y="45" transform="rotate(-40 60 45)" />
  <use href="#leaf" x="65" y="155" transform="rotate(-120 65 155)" />
  <use href="#leaf" x="45" y="130" transform="rotate(20 45 130)" />
  <use href="#leaf" x="35" y="75" transform="rotate(-60 35 75)" />
  <use href="#leaf" x="80" y="32" transform="rotate(30 80 32)" />
  <use href="#gold_buds" x="50" y="145" transform="rotate(-80 50 145)" />
  <use href="#gold_buds" x="45" y="90" transform="rotate(40 45 90)" />
  <use href="#gold_buds" x="65" y="60" transform="rotate(-20 65 60)" />

  <!-- Right Botanicals -->
  <use href="#flower" x="168" y="105" transform="rotate(90 168 105)" />
  <use href="#flower" x="140" y="45" transform="rotate(40 140 45)" />
  <use href="#leaf" x="135" y="155" transform="rotate(120 135 155)" />
  <use href="#leaf" x="155" y="130" transform="rotate(-20 155 130)" />
  <use href="#leaf" x="165" y="75" transform="rotate(60 165 75)" />
  <use href="#leaf" x="120" y="32" transform="rotate(-30 120 32)" />
  <use href="#gold_buds" x="150" y="145" transform="rotate(80 150 145)" />
  <use href="#gold_buds" x="155" y="90" transform="rotate(-40 155 90)" />
  <use href="#gold_buds" x="135" y="60" transform="rotate(20 135 60)" />

  <!-- Center Monogram "B" -->
  <text x="100" y="130" font-family="'EB Garamond', Georgia, serif" font-size="88" font-weight="600" fill="#8F75BA" text-anchor="middle">B</text>
</svg>
